# dsh-subagent-templates bundle patch: inserts the delegation row.
#
# The two templates below are the **shipped starting point**, not a
# recommendation: each fixes a provider/model pair your deployment's LLM registry
# already serves, and pins both to the `personal` agent preset. The list that
# takes effect is whatever the last patch layer declares, so edit your templates
# in the profile's own `cordis.patch.yml` rather than here: that layer is
# watched, while this bundle layer is re-read only on every profile recomposition
# — an edit here applies at the next one, and a recomposition that changes this
# row's `config` restarts the row. An id-targeted override replaces the whole
# `config` object, so it must restate every key the row needs.
# The README's "The effective template list comes from the profile patch" shows
# the override in full.
#
# The row registers the `subagent` tool and `list_subagent_templates`. A preset
# that mounts `@deepseek-ai/dsh-tool-subagent` with the same tool name keeps its
# own tool (a nearer scope wins), so swap that row out of the preset to use this
# one. A delegated call creates an ordinary root Session, so the child keeps the
# model picker and the full session surface.
- insert:
    - id: subagent-templates
      name: "dsh-subagent-templates"
      config:
        toolName: subagent
        templates:
          - id: medium
            name: Medium
            description: >-
              coding, implement, explore, investigate.
            provider: opencode-go
            model: deepseek-v4.1-flash
            preset: personal
            reasoningEffort: high
          - id: high
            name: High
            description: >-
              advice, review, discussion. (not for coding!)
            provider: qwen
            model: qwen3.8-max
            preset: personal
            reasoningEffort: high
